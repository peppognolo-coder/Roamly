<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0C2A3D" />
  <title>Roamly — Offline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      background-color: #F9FBFC;
      color: #16232E;
      font-family: 'DM Sans', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 320px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      background-color: #0C2A3D;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(4, 52, 44, 0.2);
    }

    .title {
      font-family: 'Lora', Georgia, serif;
      font-size: 22px;
      font-weight: 600;
      color: #0C2A3D;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 14px;
      color: rgba(28, 43, 39, 0.55);
      line-height: 1.6;
      margin-top: -12px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: #DFF3FA;
      border: 1px solid #A3DAEC;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: #123F58;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      background: #A3DAEC;
      border-radius: 50%;
    }

    .hint {
      font-size: 12px;
      color: rgba(28, 43, 39, 0.35);
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Logo Roamly (SVG inline — nessuna dipendenza esterna) -->
    <div class="logo">
      <svg width="36" height="36" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="11" width="36" height="32" rx="2.5" fill="white" fill-opacity="0.95"/>
        <rect x="17" y="14" width="30" height="22" rx="1.5" fill="#DFF3FA"/>
        <line x1="17" y1="25" x2="47" y2="25" stroke="#A3DAEC" stroke-width="0.75" stroke-opacity="0.6"/>
        <path d="M24 36 L30.5 21" stroke="#0C2A3D" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <path d="M40 36 L33.5 21" stroke="#0C2A3D" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        <circle cx="32" cy="21" r="1.2" fill="#0F7EA8" opacity="0.9"/>
        <rect x="14" y="43" width="36" height="11" rx="0" fill="white" fill-opacity="0.95"/>
        <circle cx="32" cy="49" r="1" fill="#A3DAEC" opacity="0.7"/>
      </svg>
    </div>

    <div>
      <p class="title">Sei offline</p>
      <p class="subtitle">
        Riconnettiti a internet per accedere<br />
        al tuo diario di viaggio.
      </p>
    </div>

    <span class="badge">
      <span class="badge-dot"></span>
      Nessuna connessione
    </span>

    <p class="hint">Riapri Roamly quando sei connesso.</p>

  </div>
</body>
</html>
