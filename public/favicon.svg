<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#04342C"/>

  <!-- Polaroid frame — white card -->
  <rect x="14" y="11" width="36" height="32" rx="2.5" fill="white" fill-opacity="0.95"/>

  <!-- Photo area inside polaroid -->
  <rect x="17" y="14" width="30" height="22" rx="1.5" fill="#E1F5EE"/>

  <!-- Horizon line — subtle sky/ground division -->
  <line x1="17" y1="25" x2="47" y2="25" stroke="#9FE1CB" stroke-width="0.75" stroke-opacity="0.6"/>

  <!-- Perspective path / sentiero — converging lines to vanishing point -->
  <!-- Left edge of path -->
  <path d="M24 36 L30.5 21" stroke="#04342C" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Right edge of path -->
  <path d="M40 36 L33.5 21" stroke="#04342C" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Vanishing point dot -->
  <circle cx="32" cy="21" r="1.2" fill="#1D9E75" opacity="0.9"/>

  <!-- Polaroid bottom strip (white, wider) -->
  <rect x="14" y="43" width="36" height="9" rx="0" fill="white" fill-opacity="0.95"/>
  <!-- Bottom rounded corners -->
  <rect x="14" y="48" width="36" height="4" rx="0" fill="white" fill-opacity="0.95"/>
  <path d="M14 50 Q14 52 16.5 52 L47.5 52 Q50 52 50 50 L50 52 Q50 54.5 47.5 54.5 L16.5 54.5 Q14 54.5 14 52 Z" fill="white" fill-opacity="0.95"/>

  <!-- Small decorative dot on polaroid strip — like a timestamp -->
  <circle cx="32" cy="49" r="1" fill="#9FE1CB" opacity="0.7"/>
</svg>
