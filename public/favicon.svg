<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Roamly — il sentiero (logo 3c). Blu notte #0C2A3D, corallo #FF6B4A. -->
  <rect width="64" height="64" rx="15" fill="#0C2A3D"/>
  <!-- Bordi del sentiero in prospettiva -->
  <path d="M15 52 L28.8 25" stroke="#DFF3FA" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M49 52 L35.2 25" stroke="#DFF3FA" stroke-width="3.6" stroke-linecap="round"/>
  <!-- Mezzeria: due soli trattini, sempre più corti -->
  <path d="M32 50 L32 45" stroke="#5FB8D9" stroke-width="3" stroke-linecap="round"/>
  <path d="M32 40 L32 36.5" stroke="#5FB8D9" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Punto all'orizzonte -->
  <circle cx="32" cy="20" r="4.6" fill="#FF6B4A"/>
</svg>
